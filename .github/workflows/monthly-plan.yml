# Prépare le plan du mois le 1er de chaque mois (et à la demande : Actions > "Préparer le plan du
# mois" > Run workflow). Le plan arrive en brouillon sur le site : rien n'est exécuté sans toi.
# Avec le secret DATABASE_URL, il utilise ta base Neon (ton vrai portefeuille) ; sans, une base
# temporaire chargée pour l'occasion (test). Le plan prêt, l'e-mail du mois part (secrets SMTP_USER,
# SMTP_PASSWORD et SITE_URL ; sans eux, l'envoi est simplement sauté). "email" renvoie seulement l'e-mail.
name: Préparer le plan du mois

on:
  schedule:
    - cron: "17 7 1 * *"  # le 1er du mois à 7h17 UTC
  workflow_dispatch:
    inputs:
      action:
        description: "run = préparer le plan et envoyer l'e-mail ; show = afficher le dernier plan ; email = renvoyer l'e-mail"
        type: choice
        options: [run, show, email]
        default: run

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --extra postgres
      - name: Plan du mois
        if: inputs.action != 'email'
        run: uv run python -m trade_assistant.agent "${ACTION:-run}"
        env:
          ACTION: ${{ inputs.action }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: E-mail du mois
        if: inputs.action != 'show'
        run: uv run python -m trade_assistant.report send
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
