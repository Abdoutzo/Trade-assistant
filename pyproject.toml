[project]
name = "trade-assistant"
version = "0.1.0"
description = "Assistant d'investissement personnel : analyse, plan mensuel pour Trade Republic (PEA), guide pour apprendre."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "langchain-core>=1.6",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-groq>=1.1",
]

[project.optional-dependencies]
# Postgres in production (Neon); SQLite needs nothing.
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trade_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Explanations written for the reader: long French sentences read better unbroken.
"trade_assistant/analysis/scoring.py" = ["E501"]
