# Prépare le plan du mois le 1er de chaque mois (et à la demande : Actions > "Préparer le plan du
# mois" > Run workflow). Le plan arrive en brouillon sur le site : rien n'est exécuté sans toi.
# Avec le secret DATABASE_URL, il utilise ta base Neon (ton vrai portefeuille) ; sans, une base
# temporaire chargée pour l'occasion (test).
name: Préparer le plan du mois

on:
  schedule:
    - cron: "17 7 1 * *"  # le 1er du mois à 7h17 UTC
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --extra postgres
      - run: uv run python -m trade_assistant.agent run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
